<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 FCST 집계</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --highlight: #EEF2FF;
        }
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; color: var(--text-main); }
        .container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 20px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 700; margin: 0; }
        
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #F9FAFB; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-control { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 100%; }
        .form-control[readonly] { background-color: #F9FAFB; color: var(--text-muted); cursor: not-allowed; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: right; }
        th { background: #F9FAFB; font-weight: 600; text-align: center; color: var(--text-muted); }
        td:first-child, th:first-child { text-align: center; font-weight: 600; background: #F9FAFB; }
        .current-month { background-color: var(--highlight); color: var(--primary); font-weight: 700; }
        .editable { cursor: pointer; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #9CA3AF; }
        .editable:hover { background-color: #F3F4F6; }
        
        .header-actions { display: flex; gap: 10px; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1; right: 30px; bottom: 30px; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: visibility 0.3s, opacity 0.3s; opacity: 0; }
        #toast.show { visibility: visible; opacity: 1; }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background-color: white; padding: 24px; border-radius: 12px; width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-title { margin-top: 0; margin-bottom: 20px; font-size: 18px; }
        .modal-footer { margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 상단 헤더 & 링크 복사 -->
        <div class="card">
            <div class="card-header" style="margin-bottom: 0;">
                <h1 class="card-title">📊 팀 FCST 집계</h1>
                <div class="header-actions">
                    <button class="btn btn-outline" onclick="openSettings()">⚙️ 연동 설정</button>
                    <button class="btn btn-outline" onclick="copyUrl()">📋 주소 복사하기</button>
                </div>
            </div>
        </div>

        <!-- 담당자 입력 폼 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">담당자 FCST 입력</h2>
                <span class="form-label">(단위: 원)</span>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">담당자명</label>
                    <select id="owner" class="form-control" onchange="checkExisting()">
                        <option value="">선택하세요</option>
                        <option value="손창곤">손창곤</option>
                        <option value="유슬아">유슬아</option>
                        <option value="옥수영">옥수영</option>
                        <option value="박명선">박명선</option>
                        <option value="최원준">최원준</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">예상 취급액</label>
                    <input type="text" id="handling" class="form-control" placeholder="0" oninput="formatNumber(this); calcRate()">
                </div>
                <div class="form-group">
                    <label class="form-label">예상 매출액/수수료</label>
                    <input type="text" id="revenue" class="form-control" placeholder="0" oninput="formatNumber(this); calcRate()">
                </div>
                <div class="form-group">
                    <label class="form-label">수수료율 (자동계산)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="rate" class="form-control" placeholder="0.00%" readonly>
                        <button id="submitBtn" class="btn btn-primary" onclick="submitData()" style="width: 100px;">제출하기</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 팀 실적 요약 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">월별 실적 및 연간 누계</h2>
                <span class="form-label" id="syncStatus">🔄 동기화 대기 중...</span>
            </div>
            <div style="overflow-x: auto;">
                <table id="matrixTable">
                    <thead>
                        <tr id="matrixHeader">
                            <th style="position: sticky; left: 0; z-index: 2;">구분</th>
                        </tr>
                    </thead>
                    <tbody id="matrixBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast">✅ 웹 도구 주소가 클립보드에 복사되었습니다.</div>

    <!-- 설정 모달 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 class="modal-title">⚙️ 구글 시트 연동 설정</h3>
            <div class="form-group">
                <label class="form-label">Google Apps Script Web App URL</label>
                <input type="text" id="scriptUrl" class="form-control" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeSettings()">취소</button>
                <button class="btn btn-primary" onclick="saveSettings()">저장</button>
            </div>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 class="modal-title" id="editModalTitle">월 실적 수정</h3>
            <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label">취급액 (원)</label>
                <input type="text" id="editHandling" class="form-control" oninput="formatNumber(this)">
            </div>
            <div class="form-group">
                <label class="form-label">매출액 (원)</label>
                <input type="text" id="editRevenue" class="form-control" oninput="formatNumber(this)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeEditModal()">취소</button>
                <button class="btn btn-primary" onclick="saveEditModal()">저장하기</button>
            </div>
            <input type="hidden" id="editMonth">
        </div>
    </div>

    <script>
        let isTyping = false;
        let localData = {
            fcst: {},
            history: {
                1: {h:0, r:0}, 2: {h:0, r:0}, 3: {h:0, r:0}, 4: {h:0, r:0},
                5: {h:0, r:0}, 6: {h:0, r:0}, 7: {h:0, r:0}, 8: {h:0, r:0},
                9: {h:0, r:0}, 10: {h:0, r:0}, 11: {h:0, r:0}, 12: {h:0, r:0}
            }
        };
        const currentMonth = new Date().getMonth() + 1;

        window.onload = () => {
            document.querySelectorAll('input').forEach(el => {
                el.addEventListener('focus', () => isTyping = true);
                el.addEventListener('blur', () => { setTimeout(()=> isTyping = false, 1000); });
            });
            renderMatrix();
            loadFromServer();
            setInterval(loadFromServer, 10000);
        };

        function formatNumber(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val) { input.value = parseInt(val, 10).toLocaleString('ko-KR'); }
        }
        function parseNum(str) {
            return parseInt((str || "0").toString().replace(/,/g, ''), 10) || 0;
        }

        function calcRate() {
            let h = parseNum(document.getElementById('handling').value);
            let r = parseNum(document.getElementById('revenue').value);
            let rateEl = document.getElementById('rate');
            if (h > 0) {
                rateEl.value = ((r / h) * 100).toFixed(2) + '%';
            } else {
                rateEl.value = '0.00%';
            }
        }

        function checkExisting() {
            let name = document.getElementById('owner').value;
            let btn = document.getElementById('submitBtn');
            if (name && localData.fcst[name]) {
                document.getElementById('handling').value = localData.fcst[name].h.toLocaleString('ko-KR');
                document.getElementById('revenue').value = localData.fcst[name].r.toLocaleString('ko-KR');
                btn.innerText = '수정하기';
                calcRate();
            } else {
                document.getElementById('handling').value = '';
                document.getElementById('revenue').value = '';
                document.getElementById('rate').value = '';
                btn.innerText = '제출하기';
            }
        }

        async function submitData() {
            let name = document.getElementById('owner').value;
            let handling = parseNum(document.getElementById('handling').value);
            let revenue = parseNum(document.getElementById('revenue').value);

            if (!name) return alert('담당자를 선택하세요.');
            if (handling === 0 && revenue === 0) return alert('금액을 입력하세요.');

            let btn = document.getElementById('submitBtn');
            let originalText = btn.innerText;
            btn.innerText = '전송 중...';
            btn.disabled = true;

            localData.fcst[name] = { h: handling, r: revenue };
            updateMatrixWithFCST();

            await sendToServer({
                action: 'upsert_fcst',
                name: name,
                handling: handling,
                revenue: revenue
            });

            btn.innerText = originalText;
            btn.disabled = false;
            alert('저장되었습니다.');
            checkExisting();
        }

        function renderMatrix() {
            let headerHtml = `<th style="position: sticky; left: 0; z-index: 2;">구분</th>`;
            for (let i = 1; i <= 12; i++) {
                if (i === currentMonth) {
                    headerHtml += `<th class="current-month">${i}월 (예상)</th>`;
                } else {
                    headerHtml += `<th class="editable" onclick="openEditModal(${i})">${i}월 ✏️</th>`;
                }
            }
            headerHtml += `<th style="position: sticky; right: 0; background: #EEF2FF; z-index: 2;">연간 누계 (YTD)</th>`;
            document.getElementById('matrixHeader').innerHTML = headerHtml;
            updateMatrixWithFCST();
        }

        function updateMatrixWithFCST() {
            let fcstTotalH = 0, fcstTotalR = 0;
            for (let key in localData.fcst) {
                fcstTotalH += localData.fcst[key].h;
                fcstTotalR += localData.fcst[key].r;
            }

            let ytdH = 0, ytdR = 0;
            let rows = { h: [], r: [], rate: [] };

            for (let i = 1; i <= 12; i++) {
                let mH = 0, mR = 0;
                if (i === currentMonth) {
                    mH = fcstTotalH; mR = fcstTotalR;
                } else {
                    mH = localData.history[i]?.h || 0;
                    mR = localData.history[i]?.r || 0;
                }
                ytdH += mH; ytdR += mR;

                let cls = (i === currentMonth) ? 'class="current-month"' : 'class="editable" onclick="openEditModal('+i+')"';
                rows.h.push(`<td ${cls}>${mH.toLocaleString('ko-KR')}</td>`);
                rows.r.push(`<td ${cls}>${mR.toLocaleString('ko-KR')}</td>`);
                let rate = mH > 0 ? ((mR / mH) * 100).toFixed(2) : '0.00';
                rows.rate.push(`<td ${cls}>${rate}%</td>`);
            }

            let ytdRate = ytdH > 0 ? ((ytdR / ytdH) * 100).toFixed(2) : '0.00';

            let bodyHtml = `
                <tr>
                    <td style="position: sticky; left: 0; background: #F9FAFB; z-index: 2; font-weight:600;">취급액</td>
                    ${rows.h.join('')}
                    <td style="position: sticky; right: 0; background: #EEF2FF; font-weight: 700;">${ytdH.toLocaleString('ko-KR')}</td>
                </tr>
                <tr>
                    <td style="position: sticky; left: 0; background: #F9FAFB; z-index: 2; font-weight:600;">매출액</td>
                    ${rows.r.join('')}
                    <td style="position: sticky; right: 0; background: #EEF2FF; font-weight: 700;">${ytdR.toLocaleString('ko-KR')}</td>
                </tr>
                <tr>
                    <td style="position: sticky; left: 0; background: #F9FAFB; z-index: 2; font-weight:600;">수수료율</td>
                    ${rows.rate.join('')}
                    <td style="position: sticky; right: 0; background: #EEF2FF; font-weight: 700; color: var(--primary);">${ytdRate}%</td>
                </tr>
            `;
            document.getElementById('matrixBody').innerHTML = bodyHtml;
        }

        function openEditModal(month) {
            document.getElementById('editMonth').value = month;
            document.getElementById('editModalTitle').innerText = `${month}월 실적 수정`;
            let h = localData.history[month]?.h || 0;
            let r = localData.history[month]?.r || 0;
            document.getElementById('editHandling').value = h.toLocaleString('ko-KR');
            document.getElementById('editRevenue').value = r.toLocaleString('ko-KR');
            document.getElementById('editModal').classList.add('show');
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('show'); }
        async function saveEditModal() {
            let month = parseInt(document.getElementById('editMonth').value);
            let h = parseNum(document.getElementById('editHandling').value);
            let r = parseNum(document.getElementById('editRevenue').value);
            
            localData.history[month] = {h: h, r: r};
            updateMatrixWithFCST();
            closeEditModal();

            await sendToServer({
                action: 'update_history',
                month: month,
                handling: h,
                revenue: r
            });
        }

        function getUrl() { return localStorage.getItem('fcst_sheet_url'); }
        function openSettings() {
            document.getElementById('scriptUrl').value = getUrl() || '';
            document.getElementById('settingsModal').classList.add('show');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
        function saveSettings() {
            localStorage.setItem('fcst_sheet_url', document.getElementById('scriptUrl').value);
            closeSettings();
            loadFromServer();
        }

        async function loadFromServer() {
            if (isTyping) return;
            let url = getUrl();
            if (!url) return;
            try {
                let res = await fetch(url);
                let json = await res.json();
                
                if (json.fcst) localData.fcst = json.fcst;
                if (json.history) localData.history = Object.assign(localData.history, json.history);
                
                updateMatrixWithFCST();
                let now = new Date();
                document.getElementById('syncStatus').innerText = `✅ 동기화 완료 (${now.getHours()}:${now.getMinutes()})`;
            } catch (e) {
                console.log('Load error', e);
            }
        }

        async function sendToServer(payload) {
            let url = getUrl();
            if (!url) return;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.log('Save error', e);
            }
        }

        function copyUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                let toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            });
        }
    </script>
</body>
</html>
